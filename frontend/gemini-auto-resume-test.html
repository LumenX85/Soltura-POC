<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soltura — Test reprise Gemini</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    background: #f5f5f5;
    color: #222;
  }

  h1 {
    font-size: 26px;
    line-height: 1.2;
    margin: 0 0 24px 0;
  }

  button {
    display: block;
    width: 100%;
    max-width: 500px;
    min-height: 56px;
    margin: 12px 0;
    padding: 12px 16px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  pre {
    width: 100%;
    max-width: 700px;
    margin-top: 24px;
    padding: 16px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: monospace;
    font-size: 16px;
    line-height: 1.5;
    background: white;
    border: 1px solid #ccc;
    border-radius: 10px;
  }

  @media (max-width: 600px) {
    body {
      padding: 16px;
      font-size: 18px;
    }

    h1 {
      font-size: 24px;
    }

    pre {
      font-size: 16px;
    }
  }
</style>

</head>

<body>
<h1>Soltura — Test vocal + reprise de session</h1>

<button id="connect">1. Connexion Gemini</button>
<button id="talk" disabled>2. Parler</button>
<button id="finish" disabled>3. Terminer</button>
<button id="resume" disabled>4. Tester la reprise</button>

<button id="export-log" type="button">Exporter le journal</button>
<p>Export local manuel. Le journal contient les transcriptions : vérifiez-le avant de le partager.</p>

<pre id="log">Prêt.</pre>

<script>
const connectButton = document.getElementById("connect");
const talkButton = document.getElementById("talk");
const finishButton = document.getElementById("finish");
const resumeButton = document.getElementById("resume");
const log = document.getElementById("log");

let socket = null;

// Diagnostic de session
let socketOpenedAt = null;
let audioReceivedThisTurn = false;
let sessionHandle = null;
let intentionalCloseForResume = false;
let recoveryAttempted = false;
let waitingForGeminiAt = null;

let inputStream = null;
let inputContext = null;
let inputSource = null;
let inputProcessor = null;

let outputContext = null;
let nextPlaybackTime = 0;

// Journal local : aucun message de protocole ni contenu audio conservé.
const journal = [];
const journalStartedAt = performance.now();
const privateValues = new Set();
let connectionSequence = 0;
let turnSequence = 0;
let captureSequence = 0;
let activeConnectionId = 0;
let activeTurnId = 0;
let activeCaptureId = 0;
let captureStartedAt = null;
let sessionStartedAt = null;

function redact(message) {
  let text = String(message);
  for (const value of privateValues) {
    if (value) text = text.split(value).join("[secret masqué]");
  }
  return text
    .replace(/AIza[\w-]+/g, "[clé masquée]")
    .replace(/((?:access_token|api[_-]?key|token|handle)\s*[=:]\s*)[^\s&,;]+/gi,
      "$1[secret masqué]")
    .replace(/[\r\n\u2028\u2029]/g, " ");
}

function write(message, context = {}) {
  const entry = {
    sequence: journal.length + 1,
    timestamp: new Date().toISOString(),
    elapsedMs: Math.round(performance.now() - journalStartedAt),
    connection: activeConnectionId,
    turn: activeTurnId,
    capture: activeCaptureId,
    ...context,
    message: redact(message)
  };
  journal.push(entry);
  log.textContent += "\n" + formatEntry(entry);
}

const windowDiagnosticWrite = write;

function formatEntry(entry) {
  return `[${entry.timestamp}] #${entry.sequence} +${entry.elapsedMs}ms ` +
    `connexion=${entry.connection} tour=${entry.turn} micro=${entry.capture} ` +
    redact(entry.message);
}

function buttonState() {
  return [connectButton, talkButton, finishButton, resumeButton]
    .map(button => button.id + "=" + (button.disabled ? "désactivé" : "actif"))
    .join(", ");
}

new MutationObserver(() => write("Boutons : " + buttonState()))
  .observe(document.body, { subtree: true, attributes: true, attributeFilter: ["disabled"] });

function safeErrorName(error) {
  const allowed = ["NotAllowedError", "NotFoundError", "NotReadableError",
    "AbortError", "SecurityError", "InvalidStateError", "TypeError", "SyntaxError",
    "OverconstrainedError", "NetworkError"];
  return allowed.includes(error?.name) ? error.name : "Erreur non détaillée";
}

function diagnosticSend(target, payload, label, context = {}) {
  write("Tentative d'envoi : " + label + " ; état WebSocket=" + target?.readyState,
    context);
  try {
    target.send(JSON.stringify(payload));
    write("Envoi remis au WebSocket : " + label, context);
  } catch (error) {
    write("Échec d'envoi : " + label + " ; " + safeErrorName(error), context);
    throw error;
  }
}

document.getElementById("export-log").addEventListener("click", () => {
  write("Action utilisateur : Exporter le journal ; boutons : " + buttonState());
  const exportedAt = new Date().toISOString();
  const text = "Soltura — journal local de diagnostic\n" +
    "Export UTC : " + exportedAt + "\n" +
    "Durée depuis le chargement : " + Math.round(performance.now() - journalStartedAt) +
    " ms\nLes envois journalisés ne prouvent pas leur réception par Gemini.\n\n" +
    journal.map(formatEntry).join("\n") + "\n";
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "soltura-journal-" + exportedAt.replace(/[:.]/g, "-") + ".txt";
  document.body.appendChild(link);
  try {
    link.click();
  } finally {
    link.remove();
    // Laisser le navigateur consommer l'URL avant de la libérer.
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
});
write("Journal initialisé ; boutons : " + buttonState());

function floatTo16BitPCM(float32Array) {
  const buffer = new ArrayBuffer(float32Array.length * 2);
  const view = new DataView(buffer);

  for (let i = 0; i < float32Array.length; i++) {
    let sample = Math.max(-1, Math.min(1, float32Array[i]));

    sample = sample < 0
      ? sample * 0x8000
      : sample * 0x7FFF;

    view.setInt16(i * 2, sample, true);
  }

  return new Uint8Array(buffer);
}

function bytesToBase64(bytes) {
  let binary = "";

  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }

  return btoa(binary);
}

function base64ToInt16(base64) {
  const binary = atob(base64);
  const buffer = new ArrayBuffer(binary.length);
  const bytes = new Uint8Array(buffer);

  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }

  return new Int16Array(buffer);
}

function playPCM(base64Audio, context = {}) {
  write("Bloc audio reçu (contenu non journalisé)", context);
  if (!outputContext) {
    outputContext = new AudioContext({
      sampleRate: 24000
    });

    nextPlaybackTime = outputContext.currentTime;
  }

  const pcm16 = base64ToInt16(base64Audio);
  const float32 = new Float32Array(pcm16.length);

  for (let i = 0; i < pcm16.length; i++) {
    float32[i] = pcm16[i] / 32768;
  }

  const audioBuffer = outputContext.createBuffer(
    1,
    float32.length,
    24000
  );

  audioBuffer.copyToChannel(float32, 0);

  const source = outputContext.createBufferSource();

  source.buffer = audioBuffer;
  source.connect(outputContext.destination);

  const startTime = Math.max(
    outputContext.currentTime,
    nextPlaybackTime
  );

  source.addEventListener("ended", () => {
    write("Fin de lecture observable du bloc audio", context);
  });
  write("Lecture programmée : durée=" + Math.round(audioBuffer.duration * 1000) +
    " ms ; délai=" + Math.round((startTime - outputContext.currentTime) * 1000) +
    " ms ; contexte=" + outputContext.state, context);
  source.start(startTime);

  nextPlaybackTime =
    startTime + audioBuffer.duration;
}

async function getToken() {
  const tokenRequestedAt = performance.now();
  write("Demande du jeton...");

  const response =
    await fetch(
      "/gemini-token"
    );

  write("Réponse du service de jeton : HTTP " + response.status +
    " ; délai=" + Math.round(performance.now() - tokenRequestedAt) + " ms");
  const tokenData = await response.json();

  if (!tokenData.token) {
    throw new Error("Jeton Gemini absent.");
  }

  write("Jeton reçu.");

  privateValues.add(tokenData.token);
  return tokenData.token;
}

async function openGeminiConnection(resume = false) {
  const connectionId = ++connectionSequence;
  activeConnectionId = connectionId;
  const requestedAt = performance.now();
  let openedAt = null;
  const write = message => windowDiagnosticWrite(message, { connection: connectionId });
  write("Tentative de connexion ; reprise=" + resume);
  const token = await getToken();

  const endpoint =
    "wss://generativelanguage.googleapis.com/ws/" +
    "google.ai.generativelanguage.v1beta." +
    "GenerativeService.BidiGenerateContentConstrained" +
    "?access_token=" +
    encodeURIComponent(token);

  socket = new WebSocket(endpoint);

  socket.onopen = () => {
    openedAt = performance.now();
    write("Ouverture WebSocket ; délai=" + Math.round(openedAt - requestedAt) + " ms");
    socketOpenedAt = Date.now();
    write(
      resume
        ? "♻️ Nouveau WebSocket ouvert pour reprise."
        : "WebSocket ouvert."
    );

    const setup = {
      setup: {
        model: "models/gemini-3.8-live",

        generationConfig: {
          responseModalities: ["AUDIO"]
        },

        sessionResumption:
          resume && sessionHandle
            ? { handle: sessionHandle }
            : {},

        contextWindowCompression: {
          slidingWindow: {}
        },

        realtimeInputConfig: {
          automaticActivityDetection: {
            disabled: true
          }
        },

        inputAudioTranscription: {},
        outputAudioTranscription: {},

        systemInstruction: {
          parts: [{
            text:
              "Tu es Soltura, professeur particulier " +
              "d'espagnol d'Espagne. Réponds brièvement, " +
              "naturellement et principalement en espagnol."
          }]
        }
      }
    };

    diagnosticSend(socket, setup, "configuration", { connection: connectionId });
    write("Configuration : modèle=" + setup.setup.model +
      " ; AUDIO ; détection automatique désactivée ; transcriptions activées ; reprise=" +
      Boolean(resume && sessionHandle));

    write(
      resume
        ? "Handle envoyé — demande de reprise..."
        : "Configuration envoyée."
    );
  };

  socket.onmessage = async (event) => {
    try {
      let raw;

      if (event.data instanceof Blob) {
        raw = await event.data.text();

      } else if (event.data instanceof ArrayBuffer) {
        raw = new TextDecoder().decode(event.data);

      } else {
        raw = event.data;
      }

      const data = JSON.parse(raw);
      const content = data.serverContent;

      if (data.sessionResumptionUpdate) {
        const update =
          data.sessionResumptionUpdate;

        write("Disponibilité de reprise : " + Boolean(update.resumable) +
          " ; nouveau handle présent=" + Boolean(update.newHandle));

        if (update.newHandle) {
          privateValues.add(update.newHandle);
          sessionHandle = update.newHandle;

          write(
            "🔖 Handle reçu — session reprenable : " +
            (update.resumable ? "oui" : "non")
          );

          resumeButton.disabled =
            !update.resumable;
        }
      }

      if (data.goAway) {
        write(
          "⏳ GoAway reçu" +
          (data.goAway.timeLeft
            ? " — temps restant : " +
              (typeof data.goAway.timeLeft === "string" && /^\d+(?:\.\d+)?s$/.test(data.goAway.timeLeft)
                ? data.goAway.timeLeft : "non exploitable")
            : "")
        );

        if (
          sessionHandle &&
          socket &&
          socket.readyState === WebSocket.OPEN &&
          !intentionalCloseForResume
        ) {
          write(
            "♻️ Reprise automatique préparée..."
          );

          intentionalCloseForResume = true;

          socket.close(
            1000,
            "Reprise automatique Soltura"
          );
        }
      }

      if (data.setupComplete) {
        write("setupComplete ; délai depuis ouverture=" +
          (openedAt === null ? "inconnu" : Math.round(performance.now() - openedAt) + " ms"));
        write(
          resume
            ? "✅ Session Gemini reprise et prête."
            : "✅ Gemini Live prêt."
        );

        talkButton.disabled = false;
        write("🟢 État Soltura : PRÊT");
      }

      if (content?.inputTranscription?.text) {
        write(
          "Moi (compris) : " +
          content.inputTranscription.text
        );
      }

      if (content?.outputTranscription?.text) {
        write(
          "Gemini : " +
          content.outputTranscription.text
        );
      }

      if (content?.modelTurn?.parts) {
        for (const part of content.modelTurn.parts) {
          if (part.inlineData?.data) {
            if (!audioReceivedThisTurn) {
            const audioDelay =
              waitingForGeminiAt
                ? ((Date.now() - waitingForGeminiAt) / 1000).toFixed(1)
                : "inconnu";

            write("🔊 État Soltura : RÉPONSE GEMINI");

            write(
              "🔊 Audio Gemini reçu — attente : " +
              audioDelay + " s"
            );

            audioReceivedThisTurn = true;
          }

          playPCM(part.inlineData.data, { connection: connectionId, turn: activeTurnId, capture: activeCaptureId });
          }
        }
      }

      if (content?.turnComplete) {
        write("turnComplete");
        const totalDelay =
          waitingForGeminiAt
            ? ((Date.now() - waitingForGeminiAt) / 1000).toFixed(1)
            : "inconnu";

        write(
          "— réponse terminée — durée totale : " +
          totalDelay + " s"
        );

        waitingForGeminiAt = null;
        audioReceivedThisTurn = false;
        talkButton.disabled = false;
        write("🟢 État Soltura : PRÊT");
      }

    } catch (error) {
      // Ne pas afficher des objets externes pouvant contenir des secrets.

      write("❌ Erreur de traitement Gemini ou de lecture audio : " + safeErrorName(error));
    }
  };

  socket.onclose = async event => {
    write("Fermeture WebSocket : code=" + event.code + " ; propre=" + event.wasClean +
      " ; durée connexion=" + (openedAt === null ? "inconnue" :
        Math.round(performance.now() - openedAt) + " ms"));
    write("Durée session depuis Connexion=" +
      (sessionStartedAt === null ? "inconnue" : Math.round(performance.now() - sessionStartedAt) + " ms"));
    let connectionDuration = "inconnue";

    if (socketOpenedAt) {
      const totalSeconds =
        Math.round((Date.now() - socketOpenedAt) / 1000);

      const minutes =
        Math.floor(totalSeconds / 60);

      const seconds =
        totalSeconds % 60;

      connectionDuration =
        minutes + " min " + seconds + " s";
    }

    write(
      "🔌 Connexion fermée : " +
      event.code +
      " — motif distant omis (confidentialité)" +
      " — durée : " + connectionDuration
    );

    socketOpenedAt = null;

    talkButton.disabled = true;
    finishButton.disabled = true;
    write("🔴 État Soltura : CONNEXION INTERROMPUE");

    if (intentionalCloseForResume) {
      intentionalCloseForResume = false;

      write(
        "♻️ Ouverture d'une nouvelle connexion..."
      );

      try {
        await openGeminiConnection(true);
      } catch (error) {
        // Ne pas afficher des objets externes pouvant contenir des secrets.

        write(
          "❌ Reprise impossible : " +
          "détails omis (confidentialité)"
        );

        connectButton.disabled = false;
      }

      return;
    }

    if (
      event.code === 1011 &&
      sessionHandle &&
      !recoveryAttempted
    ) {
      recoveryAttempted = true;

      write(
        "⚠️ Fermeture 1011 — tentative unique de récupération."
      );

      try {
        await openGeminiConnection(true);
      } catch (error) {
        // Ne pas afficher des objets externes pouvant contenir des secrets.

        write(
          "❌ Récupération 1011 impossible : " +
          "détails omis (confidentialité)"
        );

        connectButton.disabled = false;
      }

      return;
    }

    if (
      event.code === 1011 &&
      recoveryAttempted
    ) {
      write(
        "❌ Nouvelle erreur 1011 après récupération — arrêt."
      );
    }

    connectButton.disabled = false;
  };

  socket.onerror = error => {
    // Ne pas afficher des objets externes pouvant contenir des secrets.
    write("❌ Erreur WebSocket.");
  };
}

connectButton.addEventListener("click", async () => {
  sessionStartedAt = performance.now();
  write("Action utilisateur : Connexion ; boutons : " + buttonState());
  try {
    connectButton.disabled = true;

    write("=== SESSION INITIALE ===");

    await openGeminiConnection(false);

  } catch (error) {
    // Ne pas afficher des objets externes pouvant contenir des secrets.

    write("❌ Connexion impossible : " + safeErrorName(error));

    connectButton.disabled = false;
  }
});

resumeButton.addEventListener("click", () => {
  write("Action utilisateur : Reprise ; boutons : " + buttonState());
  if (
    !sessionHandle ||
    !socket ||
    socket.readyState !== WebSocket.OPEN
  ) {
    write(
      "❌ Impossible de tester la reprise."
    );
    return;
  }

  write("");
  write("=== TEST DE REPRISE ===");
  write("Fermeture volontaire du WebSocket...");

  resumeButton.disabled = true;
  talkButton.disabled = true;

  intentionalCloseForResume = true;

  socket.close(1000, "Test reprise Soltura");
});

talkButton.addEventListener("click", async () => {
  activeTurnId = ++turnSequence;
  activeCaptureId = ++captureSequence;
  const captureId = activeCaptureId;
  const captureConnectionId = activeConnectionId;
  const turnId = activeTurnId;
  const microphoneRequestedAt = performance.now();
  captureStartedAt = microphoneRequestedAt;
  write("Action utilisateur : Parler ; boutons : " + buttonState());
  write("Demande de démarrage microphone");
  try {
    inputStream =
      await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          echoCancellation: true,
          noiseSuppression: true
        }
      });

    write("Accès microphone obtenu ; délai=" +
      Math.round(performance.now() - microphoneRequestedAt) + " ms");
    inputStream.getTracks().forEach(track => track.addEventListener("ended", () =>
      write("Microphone : piste terminée par le navigateur", { connection: captureConnectionId, capture: captureId, turn: turnId })));
    inputContext = new AudioContext({
      sampleRate: 16000
    });

    inputSource =
      inputContext.createMediaStreamSource(
        inputStream
      );

    inputProcessor =
      inputContext.createScriptProcessor(
        2048,
        1,
        1
      );

    diagnosticSend(socket, { realtimeInput: { activityStart: {} } }, "activityStart");

    inputProcessor.onaudioprocess = event => {
      try {
      if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
      ) {
        write("Envoi audio ignoré : WebSocket non ouvert", { connection: captureConnectionId, capture: captureId, turn: turnId });
        return;
      }

      const samples =
        event.inputBuffer.getChannelData(0);

      const pcm =
        floatTo16BitPCM(samples);

      const base64 =
        bytesToBase64(pcm);

      diagnosticSend(socket, {
        realtimeInput: {
          audio: {
            data: base64,
            mimeType:
              "audio/pcm;rate=" +
              inputContext.sampleRate
          }
        }
      }, "bloc audio ; échantillons=" + samples.length, { connection: captureConnectionId, capture: captureId, turn: turnId });
      } catch (error) {
        write("Erreur capture/envoi audio : " + safeErrorName(error),
          { connection: captureConnectionId, capture: captureId, turn: turnId });
        throw error;
      }
    };

    inputSource.connect(inputProcessor);
    inputProcessor.connect(
      inputContext.destination
    );

    talkButton.disabled = true;
    finishButton.disabled = false;
    write("🎙️ État Soltura : ÉCOUTE");

    write(
      "🎙 Micro actif à " +
      inputContext.sampleRate +
      " Hz — parle maintenant."
    );

  } catch (error) {
    // Ne pas afficher des objets externes pouvant contenir des secrets.

    write(
      "❌ Micro : " + safeErrorName(error)
    );
  }
});

finishButton.addEventListener("click", async () => {
  write("Action utilisateur : Terminer ; boutons : " + buttonState());
  write("Arrêt microphone demandé");
  try {
    finishButton.disabled = true;
    waitingForGeminiAt = Date.now();
    write("🟠 État Soltura : ATTENTE GEMINI");

    if (inputProcessor) {
      inputProcessor.disconnect();
      inputProcessor = null;
    }

    if (inputSource) {
      inputSource.disconnect();
      inputSource = null;
    }

    if (inputStream) {
      inputStream
        .getTracks()
        .forEach(track => track.stop());

      inputStream = null;
    }

    if (inputContext) {
      await inputContext.close();
      inputContext = null;
    }

    if (
      socket &&
      socket.readyState === WebSocket.OPEN
    ) {
      diagnosticSend(socket, { realtimeInput: { activityEnd: {} } }, "activityEnd");
    } else {
      write("activityEnd non envoyé : WebSocket non ouvert");
    }

    write("Microphone arrêté ; durée depuis demande=" +
      (captureStartedAt === null ? "inconnue" : Math.round(performance.now() - captureStartedAt) + " ms"));
    write(
      "⏹ Terminer envoyé — attente de Gemini..."
    );
  } catch (error) {
    write("Erreur pendant l'arrêt microphone ou activityEnd ; détails omis");
    throw error;
  }
});
</script>

</body>
</html>
