<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soltura — Test reprise Gemini</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    background: #f5f5f5;
    color: #222;
  }

  h1 {
    font-size: 26px;
    line-height: 1.2;
    margin: 0 0 24px 0;
  }

  button {
    display: block;
    width: 100%;
    max-width: 500px;
    min-height: 56px;
    margin: 12px 0;
    padding: 12px 16px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  pre {
    width: 100%;
    max-width: 700px;
    margin-top: 24px;
    padding: 16px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: monospace;
    font-size: 16px;
    line-height: 1.5;
    background: white;
    border: 1px solid #ccc;
    border-radius: 10px;
  }

  @media (max-width: 600px) {
    body {
      padding: 16px;
      font-size: 18px;
    }

    h1 {
      font-size: 24px;
    }

    pre {
      font-size: 16px;
    }
  }
</style>

</head>

<body>
<h1>Soltura — Test vocal + reprise de session</h1>

<button id="connect">1. Connexion Gemini</button>
<button id="talk" disabled>2. Parler</button>
<button id="finish" disabled>3. Terminer</button>
<button id="resume" disabled>4. Tester la reprise</button>

<pre id="log">Prêt.</pre>

<script>
const connectButton = document.getElementById("connect");
const talkButton = document.getElementById("talk");
const finishButton = document.getElementById("finish");
const resumeButton = document.getElementById("resume");
const log = document.getElementById("log");

let socket = null;
let sessionHandle = null;
let intentionalCloseForResume = false;

let inputStream = null;
let inputContext = null;
let inputSource = null;
let inputProcessor = null;

let outputContext = null;
let nextPlaybackTime = 0;

function write(message) {
  log.textContent += "\n" + message;
}

function floatTo16BitPCM(float32Array) {
  const buffer = new ArrayBuffer(float32Array.length * 2);
  const view = new DataView(buffer);

  for (let i = 0; i < float32Array.length; i++) {
    let sample = Math.max(-1, Math.min(1, float32Array[i]));

    sample = sample < 0
      ? sample * 0x8000
      : sample * 0x7FFF;

    view.setInt16(i * 2, sample, true);
  }

  return new Uint8Array(buffer);
}

function bytesToBase64(bytes) {
  let binary = "";

  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }

  return btoa(binary);
}

function base64ToInt16(base64) {
  const binary = atob(base64);
  const buffer = new ArrayBuffer(binary.length);
  const bytes = new Uint8Array(buffer);

  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }

  return new Int16Array(buffer);
}

function playPCM(base64Audio) {
  if (!outputContext) {
    outputContext = new AudioContext({
      sampleRate: 24000
    });

    nextPlaybackTime = outputContext.currentTime;
  }

  const pcm16 = base64ToInt16(base64Audio);
  const float32 = new Float32Array(pcm16.length);

  for (let i = 0; i < pcm16.length; i++) {
    float32[i] = pcm16[i] / 32768;
  }

  const audioBuffer = outputContext.createBuffer(
    1,
    float32.length,
    24000
  );

  audioBuffer.copyToChannel(float32, 0);

  const source = outputContext.createBufferSource();

  source.buffer = audioBuffer;
  source.connect(outputContext.destination);

  const startTime = Math.max(
    outputContext.currentTime,
    nextPlaybackTime
  );

  source.start(startTime);

  nextPlaybackTime =
    startTime + audioBuffer.duration;
}

async function getToken() {
  write("Demande du jeton...");

  const response =
    await fetch(
      "http://" +
      window.location.hostname +
      ":3000/gemini-token"
    );

  const tokenData = await response.json();

  if (!tokenData.token) {
    throw new Error("Jeton Gemini absent.");
  }

  write("Jeton reçu.");

  return tokenData.token;
}

async function openGeminiConnection(resume = false) {
  const token = await getToken();

  const endpoint =
    "wss://generativelanguage.googleapis.com/ws/" +
    "google.ai.generativelanguage.v1beta." +
    "GenerativeService.BidiGenerateContentConstrained" +
    "?access_token=" +
    encodeURIComponent(token);

  socket = new WebSocket(endpoint);

  socket.onopen = () => {
    write(
      resume
        ? "♻️ Nouveau WebSocket ouvert pour reprise."
        : "WebSocket ouvert."
    );

    const setup = {
      setup: {
        model: "models/gemini-3.8-live",

        generationConfig: {
          responseModalities: ["AUDIO"]
        },

        sessionResumption:
          resume && sessionHandle
            ? { handle: sessionHandle }
            : {},

        contextWindowCompression: {
          slidingWindow: {}
        },

        realtimeInputConfig: {
          automaticActivityDetection: {
            disabled: true
          }
        },

        inputAudioTranscription: {},
        outputAudioTranscription: {},

        systemInstruction: {
          parts: [{
            text:
              "Tu es Soltura, professeur particulier " +
              "d'espagnol d'Espagne. Réponds brièvement, " +
              "naturellement et principalement en espagnol."
          }]
        }
      }
    };

    socket.send(JSON.stringify(setup));

    write(
      resume
        ? "Handle envoyé — demande de reprise..."
        : "Configuration envoyée."
    );
  };

  socket.onmessage = async (event) => {
    try {
      let raw;

      if (event.data instanceof Blob) {
        raw = await event.data.text();

      } else if (event.data instanceof ArrayBuffer) {
        raw = new TextDecoder().decode(event.data);

      } else {
        raw = event.data;
      }

      const data = JSON.parse(raw);
      const content = data.serverContent;

      if (data.sessionResumptionUpdate) {
        const update =
          data.sessionResumptionUpdate;

        if (update.newHandle) {
          sessionHandle = update.newHandle;

          write(
            "🔖 Handle reçu — session reprenable : " +
            (update.resumable ? "oui" : "non")
          );

          resumeButton.disabled =
            !update.resumable;
        }
      }

      if (data.goAway) {
        write(
          "⏳ GoAway reçu" +
          (data.goAway.timeLeft
            ? " — temps restant : " +
              data.goAway.timeLeft
            : "")
        );

        if (
          sessionHandle &&
          socket &&
          socket.readyState === WebSocket.OPEN &&
          !intentionalCloseForResume
        ) {
          write(
            "♻️ Reprise automatique préparée..."
          );

          intentionalCloseForResume = true;

          socket.close(
            1000,
            "Reprise automatique Soltura"
          );
        }
      }

      if (data.setupComplete) {
        write(
          resume
            ? "✅ Session Gemini reprise et prête."
            : "✅ Gemini Live prêt."
        );

        talkButton.disabled = false;
      }

      if (content?.inputTranscription?.text) {
        write(
          "Moi (compris) : " +
          content.inputTranscription.text
        );
      }

      if (content?.outputTranscription?.text) {
        write(
          "Gemini : " +
          content.outputTranscription.text
        );
      }

      if (content?.modelTurn?.parts) {
        for (const part of content.modelTurn.parts) {
          if (part.inlineData?.data) {
            playPCM(part.inlineData.data);
          }
        }
      }

      if (content?.turnComplete) {
        write("— réponse terminée —");
        talkButton.disabled = false;
      }

    } catch (error) {
      console.error(error);

      write(
        "❌ Erreur de traitement Gemini."
      );
    }
  };

  socket.onclose = async event => {
    write(
      "Connexion fermée : " +
      event.code +
      (event.reason
        ? " — " + event.reason
        : "")
    );

    talkButton.disabled = true;
    finishButton.disabled = true;

    if (intentionalCloseForResume) {
      intentionalCloseForResume = false;

      write(
        "♻️ Ouverture d'une nouvelle connexion..."
      );

      try {
        await openGeminiConnection(true);
      } catch (error) {
        console.error(error);

        write(
          "❌ Reprise impossible : " +
          error.message
        );

        connectButton.disabled = false;
      }

      return;
    }

    connectButton.disabled = false;
  };

  socket.onerror = error => {
    console.error(error);
    write("❌ Erreur WebSocket.");
  };
}

connectButton.addEventListener("click", async () => {
  try {
    connectButton.disabled = true;

    write("=== SESSION INITIALE ===");

    await openGeminiConnection(false);

  } catch (error) {
    console.error(error);

    write("❌ " + error.message);

    connectButton.disabled = false;
  }
});

resumeButton.addEventListener("click", () => {
  if (
    !sessionHandle ||
    !socket ||
    socket.readyState !== WebSocket.OPEN
  ) {
    write(
      "❌ Impossible de tester la reprise."
    );
    return;
  }

  write("");
  write("=== TEST DE REPRISE ===");
  write("Fermeture volontaire du WebSocket...");

  resumeButton.disabled = true;
  talkButton.disabled = true;

  intentionalCloseForResume = true;

  socket.close(1000, "Test reprise Soltura");
});

talkButton.addEventListener("click", async () => {
  try {
    inputStream =
      await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          echoCancellation: true,
          noiseSuppression: true
        }
      });

    inputContext = new AudioContext({
      sampleRate: 16000
    });

    inputSource =
      inputContext.createMediaStreamSource(
        inputStream
      );

    inputProcessor =
      inputContext.createScriptProcessor(
        2048,
        1,
        1
      );

    socket.send(JSON.stringify({
      realtimeInput: {
        activityStart: {}
      }
    }));

    inputProcessor.onaudioprocess = event => {
      if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
      ) {
        return;
      }

      const samples =
        event.inputBuffer.getChannelData(0);

      const pcm =
        floatTo16BitPCM(samples);

      const base64 =
        bytesToBase64(pcm);

      socket.send(JSON.stringify({
        realtimeInput: {
          audio: {
            data: base64,
            mimeType:
              "audio/pcm;rate=" +
              inputContext.sampleRate
          }
        }
      }));
    };

    inputSource.connect(inputProcessor);
    inputProcessor.connect(
      inputContext.destination
    );

    talkButton.disabled = true;
    finishButton.disabled = false;

    write(
      "🎙 Micro actif à " +
      inputContext.sampleRate +
      " Hz — parle maintenant."
    );

  } catch (error) {
    console.error(error);

    write(
      "❌ Micro : " +
      error.message
    );
  }
});

finishButton.addEventListener("click", async () => {
  finishButton.disabled = true;

  if (inputProcessor) {
    inputProcessor.disconnect();
    inputProcessor = null;
  }

  if (inputSource) {
    inputSource.disconnect();
    inputSource = null;
  }

  if (inputStream) {
    inputStream
      .getTracks()
      .forEach(track => track.stop());

    inputStream = null;
  }

  if (inputContext) {
    await inputContext.close();
    inputContext = null;
  }

  if (
    socket &&
    socket.readyState === WebSocket.OPEN
  ) {
    socket.send(JSON.stringify({
      realtimeInput: {
        activityEnd: {}
      }
    }));
  }

  write(
    "⏹ Terminer envoyé — attente de Gemini..."
  );
});
</script>

</body>
</html>
